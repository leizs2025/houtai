<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>后台导航面板</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      padding: 40px;
      font-family: "Segoe UI", sans-serif;
      background: #fff8e7;
    }
    .nav-card {
      padding: 25px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      /* ⚠️ 关键修改：将 margin-bottom 改为 mb-3 或在 row 中统一控制间距 */
      margin-bottom: 20px; 
      transition: transform 0.2s;
      height: 100%; /* 让同一行的卡片高度保持一致 */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .nav-card:hover {
      transform: scale(1.02);
    }
    h2 {
      margin-bottom: 30px;
      color: #b80000;
    }
    .username {
      text-align: right;
      margin-bottom: 20px;
      font-weight: bold;
      color: #555;
    }
    .restricted {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="username">👤 当前用户：<span id="whoLogin">未知</span></div>
    <h2 class="text-center">🔧 后台导航面板</h2>

    <!-- ✅ 新增：Bootstrap Row 容器 -->
    <div class="row g-3"> 
      
      <!-- ✅ 新增：col-md-4 实现一行3列，col-sm-6 实现小屏一行2列 -->
      <div class="col-md-4 col-sm-6">
        <div class="nav-card">
          <h5>🪔 超度管理后台</h5>
          <a href="https://leizs2025.github.io/houtai/chaodu/index1.html" target="_blank" class="btn btn-success">进入系统</a>
        </div>
      </div>

      <div class="col-md-4 col-sm-6">
        <div class="nav-card">
          <h5>🙏 祈福管理后台</h5>
          <a href="https://leizs2025.github.io/houtai/qifu/index.html" target="_blank" class="btn btn-primary">进入系统</a>
        </div>
      </div>

      <div class="col-md-4 col-sm-6">
        <div class="nav-card">
          <h5>💡 太岁光明灯后台 2026更新版本</h5>
          <a href="https://leizs2025.github.io/1/crud-admin/test.html" target="_blank" class="btn btn-warning">进入系统</a>
        </div>
      </div>

      <div class="col-md-4 col-sm-6">
        <div class="nav-card">
          <h5>🗑️ 太岁光明无付款数据删除管理</h5>
          <a href="https://leizs2025.github.io/1/crud-admin/del.html" target="_blank" class="btn btn-warning">进入系统</a>
        </div>
      </div>

      <div class="col-md-4 col-sm-6">
        <div class="nav-card">
          <h5>👁️ 实时预览（祈福 + 超度）</h5>
          <a href="https://leizs2025.github.io/houtai/qifu/display.html" target="_blank" class="btn btn-success">查看预览</a>
        </div>
      </div>

      <div class="col-md-4 col-sm-6">
        <div class="nav-card">
          <h5>👁️ 实时预览（太岁光明灯）</h5>
          <a href="https://leizs2025.github.io/1/crud-admin/display.html" target="_blank" class="btn btn-info">查看预览</a>
        </div>
      </div>

      <div class="col-md-4 col-sm-6 restricted">
        <div class="nav-card">
          <h5>👁️ 日结报表总览</h5>
          <a href="report.html" target="_blank" class="btn btn-info">查看预览</a>
        </div>
      </div>

      <div class="col-md-4 col-sm-6">
        <div class="nav-card">
          <h5>📋 灵骨福位资料管理系统</h5>
          <a href="https://leizs2025.github.io/houtai/linggufuwei.html" target="_blank" class="btn btn-info">进入系统</a>
        </div>
      </div>

      <div class="col-md-4 col-sm-6">
        <div class="nav-card">
          <h5>📋 水子灵资料管理系统</h5>
          <a href="https://leizs2025.github.io/houtai/suizilng.html" target="_blank" class="btn btn-primary">进入系统</a>
        </div>
      </div>

    </div> <!-- /.row -->

    <div class="text-center mt-4">
      <button onclick="logout()" class="btn btn-outline-secondary">🚪 登出返回登录</button>
    </div>
  </div>

  <script>
    const admin = localStorage.getItem("admin");
    const role = localStorage.getItem("role");

    if (!admin || !role) {
      alert("请先登录！");
      location.href = "https://leizs2025.github.io/houtai/login.html";
    } else {
      document.getElementById("whoLogin").textContent = admin;
      if (role === "admin" || role === "manager") {
        window.addEventListener("DOMContentLoaded", () => {
          const restrictedElements = document.querySelectorAll(".restricted");
          restrictedElements.forEach(element => element.style.display = "block");
        });
      }
    }

    function logout() {
      localStorage.removeItem("admin");
      localStorage.removeItem("role");
      location.href = "https://leizs2025.github.io/houtai/login.html";
    }
  </script>
</body>
</html>
