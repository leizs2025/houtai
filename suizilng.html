<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水子灵资料录入系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 50px; }
        .container { max-width: 1400px; margin-top: 20px; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .table-responsive { max-height: 60vh; overflow-y: auto; }
        
        /* ✅ 表格核心样式修复 */
        #dataTable {
            width: 100%;
            table-layout: fixed;      /* 强制固定布局，防止折叠 */
            border-collapse: collapse;
        }
        th { 
            position: sticky; 
            top: 0; 
            background: #fff; 
            z-index: 10; 
            white-space: nowrap;
        }
        /* ✅ 修复操作列图标被裁切 */
            #dataTable th:nth-child(1), 
            #dataTable td:nth-child(1) {
              width: 80px !important;      /* 60px 太紧，建议 80px */
              min-width: 80px !important;
              overflow: visible !important; /* ✅ 允许图标溢出显示 */
             text-overflow: clip !important; /* ✅ 取消省略号 */
            white-space: nowrap !important;
        }
        /* ✅ 确保操作按钮不被挤压 */
            #dataTable td:nth-child(1) .btn {
            flex-shrink: 0 !important;
            padding: 2px 6px !important;  /* 紧凑按钮内边距 */
            font-size: 14px !important;
            line-height: 1.2 !important;
            margin: 0 2px !important;     /* 减小按钮间距 */
        }
        #dataTable th, #dataTable td {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;  /* 超长显示省略号 */
            vertical-align: middle !important;
        }
        
        /* ✅ 6列宽度精确分配 */
        #dataTable th:nth-child(1), #dataTable td:nth-child(1) { width: 60px; text-align: center; } /* 操作列 */
        #dataTable th:nth-child(2), #dataTable td:nth-child(2) { width: 14%; } /* 創建日期 */
        #dataTable th:nth-child(3), #dataTable td:nth-child(3) { width: 16%; } /* 水子靈姓名 */
        #dataTable th:nth-child(4), #dataTable td:nth-child(4) { width: 14%; } /* 水子靈編號 */
        #dataTable th:nth-child(5), #dataTable td:nth-child(5) { width: 18%; } /* 親屬1 */
        #dataTable th:nth-child(6), #dataTable td:nth-child(6) { width: 18%; } /* 親屬2 */
        #dataTable th:nth-child(7), #dataTable td:nth-child(7) { width: 20%; } /* 功德主 */

        .section-title { background: #e9ecef; padding: 8px 12px; font-weight: bold; margin-top: 15px; border-left: 4px solid #0d6efd; }
        .btn-action { margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📋 水子灵资料管理系统</h2>
        <button class="btn btn-primary" onclick="openModal()">➕ 新增资料</button>
    </div>

    <!-- 查询栏 -->
    <div class="card p-3">
        <div class="row g-3">
            <div class="col-md-4">
                <input type="text" id="searchInput" class="form-control" placeholder="输入姓名、编号或电话搜索...">
            </div>
            <div class="col-md-2">
                <button class="btn btn-success w-100" onclick="loadData()">🔍 查询 / 刷新</button>
            </div>
            <div class="col-md-6 text-end">
                <span id="statusText" class="text-muted small"></span>
            </div>
        </div>
    </div>

    <!-- 数据表格 -->
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover table-bordered mb-0" id="dataTable">
                <thead class="table-light">
                    <tr id="tableHeader">
                        <!-- JS动态生成表头 -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" class="text-center py-4">点击查询加载数据...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 编辑/新增 模态框 (保持不变) -->
<div class="modal fade" id="dataModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">资料录入</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="dataForm">
                    <input type="hidden" id="rowIndex">
                    <div class="section-title">基础信息</div>
                    <div class="row g-3 mt-1" id="formBasic"></div>
                    <div class="section-title">亲属 1 信息</div>
                    <div class="row g-3 mt-1" id="formP1"></div>
                    <div class="section-title">亲属 2 信息</div>
                    <div class="row g-3 mt-1" id="formP2"></div>
                    <div class="section-title">功德主信息</div>
                    <div class="row g-3 mt-1" id="formDonor"></div>
                    <div class="section-title">登记与签名</div>
                    <div class="row g-3 mt-1" id="formReg"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveData()">💾 保存</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ✅ 配置区
    const GAS_URL = 'https://ling.gealarm2012.workers.dev';
    const APP_ID = 'shuiziling'; 

    // ✅ 列表页固定显示的6列（含中英文智能回退）
    const DISPLAY_COLUMNS = [
        { key: '创建日期', label: '創建日期' },
        { key: '水子灵姓名', label: '水子靈姓名' },
        { key: '水子灵编號', label: '水子靈編號' },
        { 
            label: '親屬1', 
            getValue: (row) => row['親屬1中文姓名'] || row['親屬1英文姓名'] || '' 
        },
        { 
            label: '親屬2', 
            getValue: (row) => row['親屬2中文姓名'] || row['親屬2英文姓名'] || '' 
        },
        { 
            label: '功德主', 
            getValue: (row) => row['功德主中文姓名'] || row['功德主英文姓名'] || '' 
        }
    ];

    // 表单字段定义（保持不变）
    const FIELDS = [
        {key:'创建日期', label:'创建日期', group:'basic', type:'readonly'},
        {key:'水子灵姓名', label:'水子灵姓名', group:'basic'},
        {key:'水子灵编號', label:'水子灵编号', group:'basic'},
        {key:'备注_Main', label:'主备注', group:'basic', type:'textarea'},
        
        {key:'与水子灵關係_P1', label:'与子灵关系', group:'p1', type:'select', options:['父亲','母亲'],colSize:'col-12 col-md-4'},
        {key:'親屬1中文姓名', label:'中文姓名', group:'p1', colSize:'col-12 col-md-4'},
        {key:'親屬1英文姓名', label:'英文姓名', group:'p1', colSize:'col-12 col-md-4'},
        {key:'聯絡電話_1', label:'联系电话', group:'p1', colSize:'col-12 col-md-4'},
        {key:'身份證號碼_P1', label:'身份证号', group:'p1', colSize:'col-12 col-md-4'},
        {key:'性别_P1', label:'性别', group:'p1', type:'select', options:['男','女'], colSize:'col-12 col-md-4'},
        {key:'宗教_P1', label:'宗教', group:'p1_row', type:'select', options:['天主教','基督教','佛教','拜神'],colSize:'col-6 col-md-2'},
        {key:'宗教其他_P1', label:'宗教其他', group:'p1_row', colSize:'col-6 col-md-2'},
        {key:'皈依_P1', label:'皈依蓮生活佛', group:'p1_row', colSize:'col-6 col-md-2', type:'select', options:['是','否']},
        {key:'备注_P1', label:'备注', group:'p1_row', colSize:'col-12 col-md-6'},
        {key:'聯絡地址_P1', label:'联系地址', group:'p1_addr', colSize:'col-12'},

        {key:'与水子灵關係_P2', label:'与子灵关系', group:'p2', type:'select', options:['父亲','母亲'],colSize:'col-12 col-md-4'},
        {key:'親屬2中文姓名', label:'中文姓名', group:'p2', colSize:'col-12 col-md-4'},
        {key:'親屬2英文姓名', label:'英文姓名', group:'p2', colSize:'col-12 col-md-4'},
        {key:'聯絡電話_2', label:'联系电话', group:'p2', colSize:'col-12 col-md-4'},
        {key:'身份證號碼_P2', label:'身份证号', group:'p2', colSize:'col-12 col-md-4'},
        {key:'性别_P2', label:'性别', group:'p2', type:'select', options:['男','女'], colSize:'col-12 col-md-4'},
        {key:'宗教_P2', label:'宗教', group:'p2_row', type:'select', options:['天主教','基督教','佛教','拜神'],colSize:'col-md-2'},
        {key:'宗教其他_P2', label:'宗教其他', group:'p2_row', colSize:'col-md-2'},
        {key:'皈依_P2', label:'皈依蓮生活佛', group:'p2_row', colSize:'col-md-2', type:'select', options:['是','否']},
        {key:'备注_P2', label:'备注', group:'p2_row', colSize:'col-md-6'},
        {key:'聯絡地址_P2', label:'联系地址', group:'p2_addr', colSize:'col-md-12'},

        {key:'功德主中文姓名', label:'中文姓名', group:'donor', colSize:'col-12 col-md-4'},
        {key:'功德主英文姓名', label:'英文姓名', group:'donor', colSize:'col-12 col-md-4'},
        {key:'聯絡電話_3', label:'联系电话', group:'donor', colSize:'col-12 col-md-4'},
        {key:'身份證號碼_Donor', label:'身份证号', group:'donor', colSize:'col-12 col-md-4'},
        {key:'性别_Donor', label:'性别', group:'donor', type:'select', options:['男','女'], colSize:'col-12 col-md-4'},
        {key:'宗教_Donor', label:'宗教', group:'donor_row', type:'select', options:['天主教','基督教','佛教','拜神'],colSize:'col-md-2'},
        {key:'宗教其他_Donor', label:'宗教其他', group:'donor_row', colSize:'col-md-2'},
        {key:'皈依_Donor', label:'皈依蓮生活佛', group:'donor_row', colSize:'col-md-2', type:'select', options:['是','否']},
        {key:'备注_Donor', label:'备注', group:'donor_row', colSize:'col-md-6'},
        {key:'聯絡地址_Donor', label:'联系地址', group:'donor_addr', colSize:'col-md-12'},

        {key:'登記日期', label:'登记日期', group:'reg', type:'date'},
        {key:'收據號碼', label:'收据号码', group:'reg'},
        {key:'申請人簽名', label:'申请人签名', group:'reg'},
        {key:'負責人簽名', label:'负责人签名', group:'reg'}
    ];

    let allData = [];
    const modal = new bootstrap.Modal(document.getElementById('dataModal'));

    async function workerRequest(params) {
    const formData = new FormData();
    
    // ✅ 直接使用已定义的全局常量 APP_ID
    formData.append('appId', APP_ID);  
    
    for (const [key, value] of Object.entries(params)) {
        if (value !== undefined && value !== null) {
            if (key === 'data' && typeof value === 'object') {
                formData.append(key, JSON.stringify(value));
            } else {
                formData.append(key, String(value));
            }
        }
    }

    // ✅ 直接使用已定义的全局常量 GAS_URL
    const res = await fetch(GAS_URL, {
        method: 'POST',
        body: formData,
        // ⚠️ 依然不要手动设置 Content-Type
    });

    if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    }

    return await res.json();
}


    // ========== 初始化表单 ==========
    function initForm() {
        const groups = {
            basic: 'formBasic',
            p1: 'formP1', p1_row: 'formP1', p1_addr: 'formP1',
            p2: 'formP2', p2_row: 'formP2', p2_addr: 'formP2',
            donor: 'formDonor', donor_row: 'formDonor', donor_addr: 'formDonor',
            reg: 'formReg'
        };
        [...new Set(Object.values(groups))].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = '';
        });
        FIELDS.forEach(f => {
            const colSize = f.colSize || (f.type === 'textarea' ? 'col-md-12' : 'col-md-4');
            let input = '';
            if (f.type === 'select') {
                const opts = f.options.map(o => `<option value="${o}">${o}</option>`).join('');
                input = `<select class="form-select" name="${f.key}"><option value="">请选择</option>${opts}</select>`;
            } else if (f.type === 'textarea') {
                input = `<textarea class="form-control" name="${f.key}" rows="2"></textarea>`;
            } else if (f.type === 'readonly') {
                input = `<input type="text" class="form-control-plaintext text-muted fw-bold" name="${f.key}" readonly>`;
            } else {
                input = `<input type="${f.type || 'text'}" class="form-control" name="${f.key}">`;
            }
            const html = `<div class="${colSize} mb-3"><label class="form-label small">${f.label}</label>${input}</div>`;
            const container = document.getElementById(groups[f.group]);
            if (container) container.insertAdjacentHTML('beforeend', html);
        });
    }

    // ========== ✅ 渲染表格（已重写为固定6列+智能回退）==========
    function renderTable(data) {
        const thead = document.getElementById('tableHeader');
        const tbody = document.getElementById('tableBody');
        
        // 动态生成固定表头
        thead.innerHTML = `<th>操作</th>` + DISPLAY_COLUMNS.map(c => `<th>${c.label}</th>`).join('');

        if (!data.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(row => {
            const realIdx = row._index;
            // 动态生成单元格，支持 getValue 回退逻辑
            const cells = DISPLAY_COLUMNS.map(col => {
                const val = col.getValue ? col.getValue(row) : (row[col.key] || '');
                return `<td title="${val}">${val}</td>`; // title属性方便鼠标悬停查看完整内容
            }).join('');

            return `<tr>
                <td>
                    <button class="btn btn-sm btn-outline-primary btn-action" onclick='editRow(${realIdx})'>✏️</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteRow(${realIdx})">🗑️</button>
                </td>
                ${cells}
            </tr>`;
        }).join('');
    }

    // ========== 加载数据 ==========
    async function loadData() {
        const status = document.getElementById('statusText');
        status.textContent = '加载中...';
        try {
            const json = await workerRequest({ action: 'getData' });
            if (!json.success) throw new Error(json.error || '未知错误');
            allData = json.data || [];
            renderTable(allData);
            status.textContent = `共 ${allData.length} 条记录 | 更新于 ${new Date().toLocaleTimeString()}`;
        } catch(e) {
            status.textContent = '❌ 加载失败: ' + e.message;
            console.error(e);
        }
    }

    // ========== 搜索 ==========
    document.getElementById('searchInput').addEventListener('input', function(e){
        const kw = e.target.value.toLowerCase();
        if (!kw) { renderTable(allData); return; }
        const filtered = allData.filter(r =>
            Object.values(r).some(v => String(v).toLowerCase().includes(kw))
        );
        renderTable(filtered);
    });

    // ========== 打开新增弹窗 ==========
    function openModal() {
        document.getElementById('modalTitle').textContent = '新增资料';
        document.getElementById('rowIndex').value = '';
        document.getElementById('dataForm').reset();
        const today = new Date().toISOString().split('T')[0];
        document.querySelector('[name="创建日期"]').value = today;
        document.querySelector('[name="登記日期"]').value = today;
        modal.show();
    }

    // ========== 编辑 ==========
    function editRow(index) {
        const row = allData.find(r => r._index === index);
        if (!row) return;
        document.getElementById('modalTitle').textContent = '修改资料';
        document.getElementById('rowIndex').value = index;
        FIELDS.forEach(f => {
            const el = document.querySelector(`[name="${f.key}"]`);
            if (el) el.value = row[f.key] || '';
        });
        modal.show();
    }

    // ========== ✅ 保存（统一用 saveRecord）==========
    async function saveData() {
    const form = document.getElementById('dataForm');
    const formData = new FormData(form);
    const obj = {};
    formData.forEach((v, k) => {
        obj[k] = (v === null || v === undefined) ? '' : String(v).trim();
    });

    const index = document.getElementById('rowIndex').value;
    const isUpdate = !!index;

    try {
        const params = {
            action: 'saveRecord',
            data: obj
        };
        if (index) params.index = parseInt(index);

        const json = await workerRequest(params);

        // ✅ 关键修复1：明确判断 success 字段
        if (!json || !json.success) {
            throw new Error(json?.error || json?.message || '服务器返回异常');
        }

        // ✅ 关键修复2：成功弹窗提示（之前缺失的部分）
        alert(isUpdate ? '✅ 修改成功！' : '✅ 新增成功！');

        modal.hide();
        loadData();

    } catch(e) {
        // ✅ 关键修复3：确保错误一定能被用户看到
        console.error('[saveData] 完整错误:', e);
        alert('❌ 保存失败: ' + (e.message || '未知错误'));
    }
}

// ========== ✅ 删除（用 deleteRecord）==========
async function deleteRow(index) {
    if (!confirm('确定要删除这条记录吗？')) return;
    try {
        const json = await workerRequest({ 
            action: 'deleteRecord',  // ✅ 与 Worker actions 列表一致
            index 
        });
        if (!json.success) throw new Error(json.error || '删除失败');
        loadData();
    } catch(e) {
        alert('删除失败: ' + e.message);
        console.error(e);
    }
}

    // 初始化
    initForm();
</script>
</body>
</html>
