    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ====== 配置区 ======
        const APP_ID = 'zuxianpaiwei'; 
        const WORKER_URL = 'https://ling.gealarm2012.workers.dev';
        // ====================

        let allData = [];
        let modalInstance;
        let currentEditRow = null;

        document.addEventListener('DOMContentLoaded', () => {
            modalInstance = new bootstrap.Modal(document.getElementById('recordModal'));
            loadData();
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loadData();
            });
        });

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        async function loadData() {
            showLoading(true);
            try {
                const keyword = document.getElementById('searchInput').value.trim();
                const url = `${WORKER_URL}?action=list&app=${APP_ID}${keyword ? '&q=' + encodeURIComponent(keyword) : ''}`;
                const res = await fetch(url);
                const json = await res.json();
                allData = json.data || [];
                renderTable(allData);
            } catch (err) {
                alert('加载失败: ' + err.message);
            } finally {
                showLoading(false);
            }
        }

        function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">暂无数据</td></tr>';
        return;
    }
    
    // ⚠️ 只显示这6个数据列，顺序必须与 <thead> 完全一致
    tbody.innerHTML = data.map((row, idx) => `
        <tr>
            <td>
                <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${idx})" title="编辑">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteRecord(${idx})" title="删除">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
            <td>${esc(row['创建日期'])}</td>
            <td>${esc(row['安奉者中文姓名'])}</td>
            <td>${esc(row['安奉者1中文姓名'])}</td>
            <td>${esc(row['親屬1中文姓名'])}</td>
            <td>${esc(row['親屬2中文姓名'])}</td>
            <td><span class="badge bg-info">${esc(row['祖先编號'])}</span></td>
        </tr>
    `).join('');
}

        function esc(val) { return val != null ? String(val).replace(/</g,'&lt;') : ''; }

        function openCreateModal() {
            currentEditRow = null;
            document.getElementById('modalTitle').textContent = '新增记录';
            document.getElementById('recordForm').reset();
            document.querySelector('[name="创建日期"]').value = '';
            
            document.getElementById('btnCreate').style.display = '';
            document.getElementById('btnUpdate').style.display = 'none';
            
            const idInput = document.getElementById('ancestorIdInput');
            idInput.readOnly = false;
            idInput.classList.remove('readonly-field');
            
            modalInstance.show();
        }

        function openEditModal(idx) {
            const row = allData[idx];
            if (!row) return;
            
            currentEditRow = row;
            document.getElementById('modalTitle').textContent = '编辑记录';
            
            const form = document.getElementById('recordForm');
            Object.keys(row).forEach(key => {
                const el = form.elements[key];
                if (el) el.value = row[key] ?? '';
            });
            
            document.getElementById('btnCreate').style.display = 'none';
            document.getElementById('btnUpdate').style.display = '';
            
            const idInput = document.getElementById('ancestorIdInput');
            idInput.readOnly = true;
            idInput.classList.add('readonly-field');
            
            modalInstance.show();
        }

        async function saveRecord(mode) {
            const form = document.getElementById('recordForm');
            const formData = new FormData(form);
            const record = {};
            formData.forEach((v, k) => {
                if (k === '创建日期') return;
                record[k] = v;
            });

            const payload = { app: APP_ID, data: record };

            if (mode === 'update') {
                // 使用祖先编號作为唯一锚点
                if (!currentEditRow || !currentEditRow['祖先编號']) {
                    return alert('错误：缺少祖先编號，无法更新！');
                }
                payload.action = 'update';
                payload.data['祖先编號'] = currentEditRow['祖先编號'];
            } else {
                payload.action = 'add';
            }

            showLoading(true);
            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.error || '操作失败');

                alert(mode === 'update' ? '✅ 更新成功！' : '✅ 新增成功！');

                modalInstance.hide();
                currentEditRow = null;
                await loadData();
            } catch (err) {
                alert('操作失败: ' + err.message);
            } finally {
                showLoading(false);
            }
        }

        async function deleteRecord(idx) {
            const row = allData[idx];
            if (!row || !row['祖先编號']) return alert('无法定位该记录（缺少祖先编號）');
            
            if (!confirm(`确定要删除祖先编號为「${row['祖先编號']}」的记录吗？\n此操作不可撤销。`)) return;
            
            showLoading(true);
            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'delete', 
                        app: APP_ID, 
                        '祖先编號': row['祖先编號']
                    })
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.error || '删除失败');
                await loadData();
            } catch (err) {
                alert('删除失败: ' + err.message);
            } finally {
                showLoading(false);
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            loadData();
        }
    </script>
</body>
</html>
